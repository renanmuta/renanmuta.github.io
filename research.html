<!doctype html>
<html lang="en">
<head>
  <script>
    (function () {
      const stored = localStorage.getItem('theme');
      const preferredDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = stored || (preferredDark ? 'dark' : 'light');
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Research by Renan Muta.">
  <title>Research · Renan Muta</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-shell nav">
      <a class="site-name" href="index.html">Renan Muta</a>
      <nav aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a class="active" href="research.html">Research</a>
        <a href="Renan_Muta_CV.pdf" target="_blank" rel="noopener">CV</a>
        <a href="media.html">Media</a>
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.4 15.5A8.5 8.5 0 0 1 8.5 3.6 8.5 8.5 0 1 0 20.4 15.5z"></path>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="site-shell page">
    <h1 class="page-title">Research</h1>

    <section class="research-section">
      <h2>Working Papers</h2>

      <article class="paper">
        <p class="paper-line">
          <span class="paper-title">Reputational Information Cycles</span>
          <span class="paper-authors">with Guillermo Ordoñez</span>
        </p>
      </article>

      <article class="paper">
        <p class="paper-line">
          <span class="paper-title">Building the Housing Ladder</span>
          <span class="paper-authors">with João F. Gomes and Tim Landvoigt</span>
        </p>
      </article>
    </section>
  </main>
  <script>
    (function () {
      const root = document.documentElement;
      const button = document.querySelector('.theme-toggle');
      const stored = localStorage.getItem('theme');
      const preferredDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initial = stored || (preferredDark ? 'dark' : 'light');

      function setTheme(theme) {
        root.dataset.theme = theme;
        const isDark = theme === 'dark';
        button.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
        localStorage.setItem('theme', theme);
      }

      setTheme(initial);

      button.addEventListener('click', function () {
        setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
      });
    })();
  </script>
</body>
</html>
